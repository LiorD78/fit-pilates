name: SEO ping (IndexNow + FB Graph)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.seo-state/**'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy to propagate
        run: sleep 60

      - name: SEO Pipeline (deploy-driven)
        uses: LiorD78/seo-pipeline@v2
        with:
          mode: deploy-driven
          host: fitpilates.cz
          indexnow-key: ${{ secrets.INDEXNOW_KEY }}
          fb-access-token: ${{ secrets.FB_APP_ACCESS_TOKEN }}
          url-list: |
            https://fitpilates.cz/
            https://fitpilates.cz/pilates-allegro/
            https://fitpilates.cz/gdpr.html
          ping-google-sitemap: 'true'
          fail-on-error: 'false'
